B">3</text><text x="82.0" y="342.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">1</text><text x="230.0" y="342.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">10</text><text x="378.0" y="342.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">100</text><text x="94" y="128.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">駆動時の電流 I [mA]</text><text x="230" y="377.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">抵抗 R [kΩ・対数軸]</text><text x="24" y="412.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">条件：VCC = 3.3 V</text><text x="448" y="44.0" font-family="Noto Sans JP" font-size="20" font-weight="700" fill="#263238">抵抗を大きくすると応答が遅くなる</text><text x="448" y="82.0" font-family="Noto Sans JP" font-size="20" font-weight="400" fill="#D55E00">τ = R × C</text><text x="471" y="321.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">0</text><text x="471" y="235.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">5</text><text x="471" y="149.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">10</text><text x="506.0" y="342.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">1</text><text x="654.0" y="342.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">10</text><text x="802.0" y="342.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#52616B">100</text><text x="518" y="128.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">時定数 τ [µs]</text><text x="654" y="377.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">抵抗 R [kΩ・対数軸]</text><text x="448" y="412.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">条件：配線・入力容量 C = 100 pF</text><text x="24" y="477.0" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#263238">抵抗値は上下の条件から決める</text><text x="24" y="520.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">下限：R ≥ VCC / Iallow</text><text x="24" y="556.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">上限：Rup ≤ (VCC − VIH,min) / Ileak,max</text><text x="24" y="593.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">上限：Rdown ≤ VIL,max / Ileak,max</text><text x="460" y="519.0" font-family="Noto Sans JP" font-size="17" font-weight="400" fill="#263238">Iallow：駆動側の許容電流</text><text x="460" y="555.0" font-family="Noto Sans JP" font-size="17" font-weight="400" fill="#263238">Ileak,max：合計漏れ電流の最大値</text><text x="24" y="633.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">τは時定数。10–90%立上り時間は約2.2τ。数値は設計条件の例。</text></svg>