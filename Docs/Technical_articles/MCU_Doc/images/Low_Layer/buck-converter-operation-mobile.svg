72B2">スイッチON</text><text x="24" y="80.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">入力から負荷へ電力を送る</text><text x="24" y="134.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">VIN</text><text x="100" y="114.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">SW</text><text x="229" y="114.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">L</text><text x="327" y="126.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">VOUT</text><text x="277" y="272.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">C</text><text x="331" y="250.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">負荷</text><text x="37" y="230.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">+</text><text x="38" y="253.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">−</text><text x="200" y="242.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">D</text><text x="24" y="394.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">Lの電流が増加。Dは逆バイアス</text><text x="24" y="481.0" font-family="Noto Sans JP" font-size="23" font-weight="700" fill="#D55E00">スイッチOFF</text><text x="24" y="514.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">Lの電流がダイオードを通って続く</text><text x="24" y="568.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">VIN</text><text x="100" y="548.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">SW</text><text x="229" y="548.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">L</text><text x="327" y="560.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">VOUT</text><text x="277" y="706.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">C</text><text x="331" y="684.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">負荷</text><text x="37" y="664.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">+</text><text x="38" y="687.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">−</text><text x="200" y="676.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">D</text><text x="24" y="828.0" font-family="Noto Sans JP" font-size="19" font-weight="400" fill="#263238">Dが導通し、GND側からLへ還流</text><text x="24" y="918.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">理想部品・定常状態・連続導通モード</text><text x="24" y="945.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">VOUT = VIN × D</text><text x="24" y="972.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">D：スイッチON時間の割合</text><text x="24" y="999.0" font-family="Noto Sans JP" font-size="18" font-weight="400" fill="#263238">矢印：主な負荷電流の向き</text></svg>