735" cy="106" r="3" fill="#D55E00" stroke="#D55E00" stroke-width="1.5"/><text x="28" y="43.6" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="700" fill="#263238">各機器がデータを次の機器へ順送りします</text><text x="62" y="208.52" font-family="Noto Sans JP,sans-serif" font-size="19" font-weight="700" fill="#263238">コントローラ</text><text x="270" y="207.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="700" fill="#263238">デバイス1</text><text x="462" y="207.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="700" fill="#263238">デバイス2</text><text x="654" y="207.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="700" fill="#263238">デバイス3</text><text x="200" y="172.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#0072B2">MOSI → SDI</text><text x="395" y="172.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#0072B2">SDO → SDI</text><text x="586" y="172.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#0072B2">SDO → SDI</text><text x="333" y="353.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#0072B2">デバイス3のSDO → コントローラのMISO</text><text x="28" y="86.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="700" fill="#0072B2">SCK</text><text x="28" y="112.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="700" fill="#9C4200">CS</text><text x="186" y="405.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">SCKとCSは3台で共有します。</text><text x="186" y="435.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#52616B">各機器のシフトレジスタがデータ列の一部を受け持ちます。</text></svg>