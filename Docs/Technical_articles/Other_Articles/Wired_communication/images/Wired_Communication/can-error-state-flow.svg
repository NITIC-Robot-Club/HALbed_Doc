<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650"><rect width="840" height="650" fill="white"/><rect x="24" y="70" width="350" height="80" fill="#EDF6FA" stroke="#263238" stroke-width="1.6"/><rect x="24" y="258" width="350" height="80" fill="white" stroke="#263238" stroke-width="1.6"/><rect x="24" y="446" width="350" height="80" fill="white" stroke="#263238" stroke-width="1.6"/><path d="M46,158 L46,246" stroke="#263238" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M46,246 L50.0,237.0 L42.0,237.0 Z" stroke="#263238" stroke-width="1" fill="#263238" stroke-linecap="round" stroke-linejoin="round"/><path d="M46,346 L46,434" stroke="#263238" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M46,434 L50.0,425.0 L42.0,425.0 Z" stroke="#263238" stroke-width="1" fill="#263238" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="42.68" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="700" fill="#263238">エラーカウンターと送信状態</text><text x="38" y="103.6" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="700" fill="#263238">Error Active</text><text x="38" y="136.36" font-family="Noto Sans JP,sans-serif" font-size="17" font-weight="400" fill="#52616B">通常のエラー通知</text><text x="38" y="291.6" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="700" fill="#263238">Error Passive</text><text x="38" y="324.36" font-family="Noto Sans JP,sans-serif" font-size="17" font-weight="400" fill="#52616B">受動エラーフラグで通知</text><text x="38" y="479.6" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="700" fill="#263238">Bus Off</text><text x="38" y="512.36" font-family="Noto Sans JP,sans-serif" font-size="17" font-weight="400" fill="#52616B">バスから切り離して送信停止</text><text x="72" y="193.36" font-family="Noto Sans JP,sans-serif" font-size="17" font-weight="400" fill="#263238">TEC ≥ 128 または REC ≥ 128</text><text x="72" y="381.36" font-family="Noto Sans JP,sans-serif" font-size="17" font-weight="400" fill="#263238">TEC ≥ 256</text><text x="420" y="105.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">TEC：送信エラーカウンター</text><text x="420" y="145.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">REC：受信エラーカウンター</text><text x="420" y="284.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">Error Passiveからは、</text><text x="420" y="320.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">両カウンターが127以下で</text><text x="420" y="356.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">Error Activeへ戻る。</text><text x="420" y="478.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">Bus Offの復帰条件・解除手順は</text><text x="420" y="514.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#263238">対象MCUの仕様を確認する。</text><text x="24" y="602.44" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="400" fill="#52616B">RECの増加だけではBus Offへ移行しない。</text></svg>